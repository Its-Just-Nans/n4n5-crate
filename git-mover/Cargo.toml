[package]
name = "git-mover"
version = "1.2.6"
edition = "2024"
keywords = ["utility", "git", "cli"]
categories = ["command-line-utilities"]
description = "Move git repositories to a new location"
license = "MIT"
readme = "./README.md"
documentation = "https://docs.rs/git-mover"
repository = "https://github.com/Its-Just-Nans/n4n5-utilities"
homepage = "https://github.com/Its-Just-Nans/git-mover"
workspace = "../"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11.11"
git2 = "0.21"
home = "0.5"
indicatif = "0.18.6"
log = "0.4"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "query"] }
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
url = "2.5.8"
urlencoding = "2.1.3"
