[package]
name = "music-exporter"
version = "1.1.8"
authors = ["n4n5 <its.just.n4n5@gmail.com>"]
description = "export music from different sources"
documentation = "https://docs.rs/music-exporter"
edition = "2024"
license = "MIT"
repository = "https://github.com/Its-Just-Nans/n4n5-crate"
keywords = ["music"]
categories = ["command-line-utilities"]
workspace = "../"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dotenv = "0.15.0"
env_logger = "0.11.11"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = "0.1.21"
log = "0.4.34"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2.5.8"
